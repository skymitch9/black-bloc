[project]
name = "black-bloc"
version = "0.1.0"
description = "Black Bloc — a Discord moderation and content bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0,<2",
    "discord.py>=2.4,<3",
    "pydantic-settings>=2.4,<3",
    "aiosqlite>=0.20",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.scripts]
black-bloc = "black_bloc.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["black_bloc*"]

[tool.setuptools.package-data]
black_bloc = ["data/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
