<!doctype html>

<head>

<link rel="stylesheet" href="/assets/status-shell.css">

<body data-tab="moderation">

<button id="hg-cog" class="hg-cog" type="button" aria-expanded="false" aria-controls="hg-cog-panel" aria-label="Display settings">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.56-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.09a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.09a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1.03z"/></svg>
</button>
<div id="hg-cog-panel" class="hg-cog-panel" hidden>
  <div class="hg-row">
    <label class="hg-label" for="hg-theme-select">Theme</label>
    <select id="hg-theme-select"></select>
  </div>
  <div class="hg-row">
    <span class="hg-label" id="hg-mode-label">Appearance</span>
    <div class="hg-mode-group" role="group" aria-labelledby="hg-mode-label">
      <button type="button" data-hg-mode="auto" aria-pressed="true">Auto</button>
      <button type="button" data-hg-mode="light" aria-pressed="false">Light</button>
      <button type="button" data-hg-mode="dark" aria-pressed="false">Dark</button>
    </div>
  </div>
  <p class="hg-cog-note">Remembered on this site only.</p>
</div>

<main class="dash-main">
  <div class="rail">
    <nav class="tabnav" id="tabnav" aria-label="Dashboard tabs"></nav>
    <nav class="subnav" id="subnav" aria-label="Sections on this page" hidden></nav>
  </div>

  <div class="dash-body">
    <h1>Moderation</h1>
    <p class="sub" id="subtitle">Cases and the action bar.</p>

    <section id="gate" hidden aria-live="polite">
      <div class="row" id="gate-row" data-state="pending">
        <span class="dot"></span>
        <div class="row-body">
          <div class="row-head"><span class="row-name" id="gate-title">Checking…</span></div>
          <p class="row-detail" id="gate-message">Asking the bot whether you are signed in.</p>
          <p class="row-note" id="gate-note" hidden></p>
        </div>
      </div>
      <div class="bar" id="gate-actions" hidden>
        <a class="btn" id="signin" href="#">Sign in with Discord</a>
        <button class="btn quiet" id="retry" type="button" hidden>Try again</button>
      </div>
    </section>

    <div id="dash" hidden></div>

    <div class="bar" id="footbar" hidden>
      <button class="btn quiet" id="refresh" type="button">Refresh</button>
      <button class="btn quiet" id="signout" type="button">Sign out</button>
      <span class="checked" id="checked"></span>
    </div>
  </div>
</main>

<script type="module" src="/assets/page-moderation.js"></script>
<script type="module" src="/assets/motion.js"></script>
</body>
</html>
