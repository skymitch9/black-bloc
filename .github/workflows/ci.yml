name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Tests
        run: python -m pytest -q -n auto -rfE --timeout-method=signal

      - name: Dashboard contract
        run: |
          node site/mock/server.mjs &
          sleep 2
          node site/mock/check.mjs

      - name: Preview renderer
        run: node site/mock/discordmd.test.mjs

      - name: Labels
        run: node site/mock/labels.test.mjs

      - name: Paste converter
        run: node site/mock/clipmd.test.mjs

      - name: Go-live streamers join
        run: node site/mock/golive-join.test.mjs

      - name: Dashboard columns
        run: node site/mock/layout.test.mjs
      - name: Discord mock
        run: node site/mock/discordmock.test.mjs
      - name: Marathon words
        run: node site/mock/marathon-words.test.mjs
