# Fly.io app definition — deployed 2026-08-26 (machine 85e744c4d959d8, lax).
# Do not run `fly launch`; it rewrites this file. Deploy with --ha=false.
# Runbook: docs/access/deploy.md

app = "black-bloc"
primary_region = "lax"   # nearest to Phoenix; Fly has no phx region

[build]
  dockerfile = "Dockerfile"

[env]
  DATABASE_PATH = "/data/black_bloc.sqlite3"
  LOG_LEVEL = "INFO"
  API_ENABLED = "true"
  API_HOST = "0.0.0.0"

# Persistent disk for SQLite. Create once: fly volumes create black_bloc_data --size 1
[mounts]
  source = "black_bloc_data"
  destination = "/data"

# The dashboard API (black_bloc/api). ⚠️ auto_stop_machines, auto_start_machines
# and min_machines_running are LOAD-BEARING, not tuning: this machine also holds
# the persistent OUTBOUND gateway websocket, and Fly's default auto-stop-on-idle
# would kill it — an idle HTTP service is not an idle bot. Never let a later
# `fly launch` or a "sensible defaults" edit flip these three.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = false
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
